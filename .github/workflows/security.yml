name: 🛡️ DevSecOps & Governance

on:
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read

jobs:
  governance:
    name: 👮 PR Title Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: 🎨 Validate Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  security:
    name: 🛡️ Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

  
      - name: 🐷 TruffleHog OSS (Secrets Scan)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

     
      - name: 📥 Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: 🛡️ Run Trivy Vulnerability Scanner (Soft Fail)
        run: |
          # --exit-code 0: Diz pro Trivy que encontrar vírus NÃO é erro de sistema
          # || true: O cinto de segurança final. Se tudo der errado, ele ainda passa.
          trivy fs . \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 0 || true

      - name: ⬆️ Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

    
      - name: 🏗️ Run Checkov (IaC)
        uses: bridgecrewio/checkov-action@master
        continue-on-error: true 
        with:
          directory: '.'
          framework: terraform
          output_format: sarif
          download_external_modules: true

      - name: 📡 Upload Checkov Results
        uses: github/codeql-action/upload-sarif@v3
        if: always() 
        continue-on-error: true
        with:
          sarif_file: 'results.sarif'
          category: 'checkov'

      - name: 📥 Setup Semgrep CLI
        run: python3 -m pip install semgrep

      - name: 🕵️‍♂️ Run Semgrep SAST (Soft Fail)
        run: |
          # --sarif: Formato que o GitHub entende
          # --output: Define o nome EXATO do arquivo (Resolve o erro de Path)
          # || true: O TRUQUE! Garante que o step fique VERDE mesmo com erros.
          semgrep scan --config=p/default --sarif --output=semgrep.sarif || true

      - name: ⬆️ Upload Semgrep Results
        uses: github/codeql-action/upload-sarif@v3
        if: always() 
        with:
          sarif_file: 'semgrep.sarif'
          category: 'semgrep'
